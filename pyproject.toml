[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "radot"
version = "0.1.0"
description = "Python library and command line tools for radiation dosimetry in radionuclide therapy"
readme = "README.md"
authors = [
    { name = "David Sarrut" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
requires-python = ">=3.11"
license = "LGPL-3.0-or-later"
license-files = ["LICENSE.md"]
dependencies = [
    "SimpleITK",
    "pydicom",
    "click",
    "numpy",
    "tqdm",
    "icrp107-database",
]

[project.optional-dependencies]
seg = [
    "TotalSegmentator",
]
dev = [
    "pytest",
    "scipy",
]
docs = [
    "mkdocs-material>=9.5",
]

[project.scripts]
radot = "radot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
radot = ["data/*.json", "data/opendose/*/*.json"]
