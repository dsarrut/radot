[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "radot"
version = "0.1.0"
description = "Python library and command line tools for radiation dosimetry in radionuclide therapy"
readme = "README.md"
authors = [
    { name = "David Sarrut" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
keywords = ["dosimetry", "radionuclide therapy", "SPECT", "PET", "theranostics", "OpenDose", "Monte Carlo"]
requires-python = ">=3.11"
license = "LGPL-3.0-or-later"
license-files = ["LICENSE.md"]
dependencies = [
    "SimpleITK",
    "pydicom",
    "click",
    "numpy",
    "tqdm",
    "icrp107-database",
]

[project.optional-dependencies]
seg = [
    "TotalSegmentator",
]
dev = [
    "pytest",
    "scipy",
]
docs = [
    "mkdocs-material>=9.5",
]

[project.urls]
Homepage = "https://github.com/dsarrut/radot"
Source = "https://github.com/dsarrut/radot"
Issues = "https://github.com/dsarrut/radot/issues"
Documentation = "https://github.com/dsarrut/radot/tree/main/docs"

[project.scripts]
radot = "radot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# OpenDose: only the masses and Lu177 are shipped; the rest is downloaded (radot.db), and a local
# cache in data/opendose/ must not end up in a build.
radot = ["data/*.json", "data/opendose/*/masses.json", "data/opendose/*/lu177.json.gz", "data/opendose/README.txt"]

[tool.pytest.ini_options]
testpaths = ["tests", "validation"]
